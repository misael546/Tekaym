name: Build signed Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      # Hide Android status and navigation bars for immersive gameplay
      - name: Enable immersive fullscreen gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('android/app/src/main').rglob('MainActivity.java'))
          if len(files) != 1:
              raise SystemExit(f'Expected one MainActivity.java, found {len(files)}')
          path = files[0]
          source = path.read_text()
          if 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' in source:
              print('Immersive fullscreen already configured')
              raise SystemExit(0)
          source = source.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\\nimport android.os.Bundle;\\nimport android.view.View;')
          methods = '''

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }
          '''
          pos = source.rfind('}')
          if pos < 0:
              raise SystemExit('Could not find end of MainActivity class')
          source = source[:pos] + methods + source[pos:]
          path.write_text(source)
          print(f'Immersive fullscreen configured in {path}')
          PY
      # Lock Android game orientation to landscape
      - name: Set app label and landscape orientation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const activity = /<activity\b[^>]*android:name="\.MainActivity"[^>]*>/s;
          const match = xml.match(activity);
          if (!match) throw new Error('Capacitor MainActivity not found in AndroidManifest.xml');
          let tag = match[0];
          if (/android:screenOrientation="[^"]+"/.test(tag)) tag = tag.replace(/android:screenOrientation="[^"]+"/, 'android:screenOrientation="landscape"');
          else tag = tag.replace(/>$/, ' android:screenOrientation="landscape">');
          xml = xml.replace(activity, tag);
          fs.writeFileSync(path, xml);
          if (!xml.includes('android:screenOrientation="landscape"')) throw new Error('Landscape orientation was not applied');
          console.log('Android activity locked to landscape');
          NODE
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Sign APK with persistent release key
        env:
          TEKAYM_KEYSTORE_BASE64: ${{ secrets.TEKAYM_KEYSTORE_BASE64 }}
          TEKAYM_KEYSTORE_PASSWORD: ${{ secrets.TEKAYM_KEYSTORE_PASSWORD }}
          TEKAYM_KEY_ALIAS: ${{ secrets.TEKAYM_KEY_ALIAS }}
          TEKAYM_KEY_PASSWORD: ${{ secrets.TEKAYM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TEKAYM_KEYSTORE_BASE64 TEKAYM_KEYSTORE_PASSWORD TEKAYM_KEY_ALIAS TEKAYM_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$TEKAYM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tekaym-release.jks"
          APK_IN="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="$RUNNER_TEMP/Tekaym.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/tekaym-release.jks" --ks-key-alias "$TEKAYM_KEY_ALIAS" --ks-pass env:TEKAYM_KEYSTORE_PASSWORD --key-pass env:TEKAYM_KEY_PASSWORD --out "$APK_OUT" "$APK_IN"
          "$APKSIGNER" verify "$APK_OUT"
          rm -f "$RUNNER_TEMP/tekaym-release.jks"
      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Tekaym APK build ${{ github.run_number }}
          body: Automated Android APK build for Tekaym.
          files: ${{ runner.temp }}/Tekaym.apk
          make_latest: true
